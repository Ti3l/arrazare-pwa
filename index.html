<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Arrazare Estoque</title>
<meta name="theme-color" content="#ff5a00">
<link rel="manifest" href="manifest.json">

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020b16;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.container{
  text-align:center;
  animation:entradaSuave .8s ease forwards;
}

.logo{
  width:100px;
  margin-bottom:24px;
  animation:flutuar 2.4s ease-in-out infinite;
  filter:
    drop-shadow(0 0 12px rgba(255,90,0,.35))
    drop-shadow(0 0 30px rgba(255,90,0,.25));
}

h1{
  margin:0;
  color:#ff5a00;
  font-size:38px;
  font-weight:800;
}

p{
  margin-top:14px;
  opacity:.75;
  font-size:18px;
}

.loader-bar{
  width:180px;
  height:5px;
  margin:24px auto 0;
  background:rgba(255,255,255,.08);
  border-radius:999px;
  overflow:hidden;
}

.loader-bar span{
  display:block;
  width:45%;
  height:100%;
  background:#ff5a00;
  border-radius:999px;
  animation:carregar 1.2s ease-in-out infinite;
}

@keyframes entradaSuave{
  from{opacity:0; transform:translateY(20px) scale(.95)}
  to{opacity:1; transform:translateY(0) scale(1)}
}

@keyframes flutuar{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

@keyframes carregar{
  0%{transform:translateX(-140%)}
  100%{transform:translateX(320%)}
}
</style>
</head>

<body>

<div class="container">
  <img src="icon-512.png" class="logo" alt="Arràzare">
  <h1>ARRAZARE ESTOQUE</h1>
  <p>Carregando sistema...</p>
  <div class="loader-bar"><span></span></div>
</div>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./service-worker.js");
}

setTimeout(() => {
  window.location.href =
    "https://script.google.com/macros/s/AKfycbzjSqMGuwcy5SSgz8GWjqsZheeLwJcWbIdM1hwAkXMwBebp2ZY_4MipyLotlBR1zSX7ZQ/exec";
}, 1800);
</script>

</body>
</html>
